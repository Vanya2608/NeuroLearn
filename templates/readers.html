{% extends "base.html" %}
{% block content %}
<div class="container" style="display: grid; grid-template-columns: 1fr 1fr; gap:
30px;">
<!-- INPUT PANEL -->
<div class="panel">
<h2>Source Text</h2>
<textarea id="sourceText" style="width: 100%; height: 350px; border-radius: 12px;
padding: 15px; border: 1px solid #ccc; font-family: inherit;" placeholder="Paste text
here..."></textarea>
<div style="margin-top: 15px;">
<label><input type="checkbox" id="opt-syllables"> Break Syllables</label><br>
<label><input type="checkbox" id="opt-normalize" checked> Auto-Format
Layout</label>
</div>
<button class="panel" style="width: 100%; background: var(--accent-blue); color:
white; margin-top: 20px; font-weight: bold; cursor: pointer;" onclick="convertText()"
id="convertBtn">Convert Text</button>
</div>
<!-- OUTPUT PANEL -->
<div class="panel">
<h2>Accessible View</h2>
<div id="outputArea" class="panel" style="min-height: 350px; background: white;
color: black; overflow-y: auto;"></div>
<button class="panel" style="width: 100%; background: #50E3C2; margin-top:
20px; font-weight: bold; cursor: pointer;" id="listenBtn" onclick="readAloud()"
disabled>Listen Aloud (AI Voice)</button>
</div>
</div>
<script>
async function convertText() {
const rawText = document.getElementById('sourceText').value;
const btn = document.getElementById('convertBtn');
btn.innerText = "Converting...";
const payload = {
text: rawText,
syllables: document.getElementById('opt-syllables').checked,
normalize: document.getElementById('opt-normalize').checked,
highlights: ['homophones', 'visually_similar']
};
const response = await fetch('/process', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload)
});
const data = await response.json();
document.getElementById('outputArea').innerHTML = data.processed_html;
document.getElementById('listenBtn').disabled = false;
btn.innerText = "Convert Text";
}
async function readAloud() {
window.speechSynthesis.cancel();
const prefs = await (await fetch('/api/user_preferences')).json();
const text = document.getElementById('outputArea').innerText;
const utterance = new SpeechSynthesisUtterance(text);
utterance.rate = prefs.tts_speed || 0.85;
utterance.pitch = prefs.tts_pitch || 1.0;
window.speechSynthesis.speak(utterance);
}
</script>
{% endblock %}
