{% extends "base.html" %}

{% block extra_head %}
<style>
    .auth-container {
        min-height: 85vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }
    .auth-card {
        background: var(--glass);
        backdrop-filter: blur(30px);
        padding: 60px; /* Increased padding */
        border-radius: 40px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 550px; /* Increased card size */
        transition: transform 0.3s ease;
    }
    .auth-card:hover { transform: translateY(-5px); }

    .auth-card h2 {
        font-size: 3rem; /* Larger heading */
        font-weight: 800;
        margin-bottom: 15px;
        color: var(--primary-indigo);
        letter-spacing: -1.5px;
    }
    .text-muted { font-size: 1.1rem; margin-bottom: 40px; opacity: 0.6; }

    .form-label { margin-bottom: 10px; display: block; font-size: 0.85rem; letter-spacing: 1px; color: var(--primary-indigo); }
    
    .form-control {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(0, 0, 0, 0.05);
        border-radius: 20px;
        padding: 16px 25px;
        font-size: 1.1rem;
        font-weight: 500;
        margin-bottom: 25px;
        width: 100%;
        transition: 0.4s;
    }
    .form-control:focus {
        background: white;
        border-color: var(--primary-indigo);
        box-shadow: 0 15px 30px rgba(67, 56, 202, 0.1);
        outline: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" data-aos="zoom-in">
        <div class="text-center">
            <h2>Welcome.</h2>
            <p class="text-muted fw-bold">Sign in to your neural learning environment.</p>
        </div>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold text-uppercase">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Your account name" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold text-uppercase">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-glow w-100 py-3" style="font-size: 1.2rem; border-radius: 20px;">
                ENTER WORKSPACE <i class="fas fa-sign-in-alt ms-2"></i>
            </button>
        </form>

        <div class="text-center mt-5">
            <p class="small fw-bold opacity-75">New to the platform? <a href="{{ url_for('register') }}" class="text-primary text-decoration-none">Create an account</a></p>
        </div>
    </div>
</div>
{% endblock %}
