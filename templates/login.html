<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroLearn | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --accent-cyan: #00F2FF;
            --glass: rgba(255, 255, 255, 0.03);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body {
            background: radial-gradient(circle at center, #1a1a2e 0%, #050505 100%);
            height: 100vh; display: flex; justify-content: center; align-items: center; color: white;
        }
        .gateway-card {
            background: var(--glass); backdrop-filter: blur(25px);
            padding: 50px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.05);
            width: 450px; text-align: center; box-shadow: 0 40px 100px rgba(0,0,0,0.5);
        }
        h2 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(to right, #fff, var(--accent-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { opacity: 0.5; margin-bottom: 30px; }
        
        input {
            width: 100%; padding: 18px; margin: 10px 0; border-radius: 15px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: white; font-size: 1rem; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 15px rgba(0,242,255,0.2); }
        
        .btn-submit {
            width: 100%; padding: 18px; margin-top: 20px; border-radius: 50px;
            background: white; color: black; font-weight: 800; border: none;
            cursor: pointer; transition: 0.4s; font-size: 1rem;
        }
        .btn-submit:hover { background: var(--accent-cyan); transform: scale(1.02); }
        
        .footer-link { margin-top: 25px; font-size: 0.9rem; opacity: 0.6; }
        .footer-link a { color: var(--accent-cyan); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="gateway-card">
        <h2>Welcome Back</h2>
        <p>Your workspace is ready for you.</p>
        
        <form action="{{ url_for('login') }}" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn-submit">LOGIN TO INTERFACE</button>
        </form>
        
        <div class="footer-link">
            New to the future? <a href="{{ url_for('register') }}">Create Account</a>
        </div>
    </div>
</body>
</html>
