{% extends "base.html" %}

{% block content %}
<div class="container" style="display: flex; justify-content: center;">
    <div class="panel" style="width: 100%; max-width: 600px;">
        <h2>Reading Preferences</h2>
        <p style="text-align: center; margin-bottom: 20px;">Adjust settings to make reading easier for you.</p>
        
        <form method="POST" action="{{ url_for('profile') }}">
            <div class="form-group">
                <label for="theme">Color Theme</label>
                <select name="theme" id="theme" style="width: 100%; padding: 10px; border-radius: 5px;">
                    <option value="light" {% if profile.theme == 'light' %}selected{% endif %}>Default (Light Cream)</option>
                    <option value="dark" {% if profile.theme == 'dark' %}selected{% endif %}>Dark Mode</option>
                    <option value="sepia" {% if profile.theme == 'sepia' %}selected{% endif %}>Sepia</option>
                    <option value="high-contrast" {% if profile.theme == 'high-contrast' %}selected{% endif %}>High Contrast</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="font_size">Font Size</label>
                <select name="font_size" id="font_size" style="width: 100%; padding: 10px; border-radius: 5px;">
                    <option value="small" {% if profile.font_size == 'small' %}selected{% endif %}>Small</option>
                    <option value="medium" {% if profile.font_size == 'medium' %}selected{% endif %}>Medium (Default)</option>
                    <option value="large" {% if profile.font_size == 'large' %}selected{% endif %}>Large</option>
                </select>
            </div>

            <div class="form-group">
                <label for="line_spacing">Spacing & Layout</label>
                <select name="line_spacing" id="line_spacing" style="width: 100%; padding: 10px; border-radius: 5px;">
                    <option value="normal" {% if profile.line_spacing == 'normal' %}selected{% endif %}>Normal</option>
                    <option value="relaxed" {% if profile.line_spacing == 'relaxed' %}selected{% endif %}>Relaxed</option>
                    <option value="loose" {% if profile.line_spacing == 'loose' %}selected{% endif %}>Loose (Very Spaced)</option>
                </select>
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label>Reading Speed (TTS): <span id="speedVal">{{ profile.tts_speed }}</span></label>
                <input type="range" name="tts_speed" min="0.5" max="1.5" step="0.1" value="{{ profile.tts_speed }}" class="form-range" style="width: 100%;" oninput="document.getElementById('speedVal').innerText=this.value">
            </div>

            <div class="form-group">
                <label>Voice Pitch: <span id="pitchVal">{{ profile.tts_pitch }}</span></label>
                <input type="range" name="tts_pitch" min="0.5" max="1.5" step="0.1" value="{{ profile.tts_pitch }}" class="form-range" style="width: 100%;" oninput="document.getElementById('pitchVal').innerText=this.value">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">Save Preferences</button>
        </form>
    </div>
</div>
{% endblock %}
