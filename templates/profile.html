{% extends "base.html" %}

{% block extra_head %}
<style>
    /* PASTEL FEATHER THEME CONFIGURATION */
    :root {
        --primary-indigo: #6366f1;
        --accent-pink: #fce7f3;
        --accent-blue: #e0f2fe;
        --glass: rgba(255, 255, 255, 0.45);
        --text-dark: #1e1b4b;
    }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        /* Fixed pastel gradient background */
        background: linear-gradient(135deg, var(--accent-pink) 0%, var(--accent-blue) 100%) !important;
        position: relative;
        color: var(--text-dark);
        transition: background 0.4s ease;
    }

    /* Feather Overlay Layer */
    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        /* Abstract feather/ink texture consistent with other pages */
        background-image: url('https://images.unsplash.com/photo-1617791160505-6f00504e3519?auto=format&fit=crop&q=80&w=1600');
        background-size: cover;
        background-position: center;
        opacity: 0.2; 
        z-index: -1;
        pointer-events: none;
    }

    .profile-container { padding: 60px 20px; display: flex; justify-content: center; position: relative; }
    
    .settings-card {
        background: var(--glass);
        backdrop-filter: blur(40px);
        border-radius: 50px;
        padding: 60px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.04);
        width: 100%;
        max-width: 800px;
    }

    .section-title {
        font-size: 1.8rem; font-weight: 800; color: var(--primary-indigo);
        margin-bottom: 30px; display: flex; align-items: center; gap: 12px;
        letter-spacing: -1px;
    }
    .section-title i { font-size: 1.5rem; opacity: 0.6; }

    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 50px; }

    .setting-item { margin-bottom: 25px; }
    .setting-item label { display: block; font-weight: 800; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 15px; opacity: 0.7; color: var(--text-dark); }
    
    select, input[type="range"] {
        width: 100%; padding: 15px 20px; border-radius: 15px;
        border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.6);
        font-weight: 600; font-family: inherit; transition: 0.3s;
        color: var(--text-dark);
    }
    select:focus { outline: none; border-color: var(--primary-indigo); background: white; }

    /* Custom Range Slider */
    input[type="range"] { padding: 0; cursor: pointer; height: 8px; border: none; accent-color: var(--primary-indigo); }
    .val-badge { background: var(--primary-indigo); color: white; padding: 2px 10px; border-radius: 20px; font-size: 0.75rem; float: right; }

    .save-btn {
        width: 100%; padding: 20px; border-radius: 25px; font-size: 1.2rem;
        font-weight: 800; letter-spacing: 1px; color: white; border: none;
        background: var(--primary-indigo);
        box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
        cursor: pointer; transition: 0.3s;
    }
    .save-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(99, 102, 241, 0.3); }

    /* Floating Blobs for Extra Depth */
    .bg-blob {
        position: fixed;
        width: 500px; height: 500px;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.25;
        z-index: -1;
        animation: floatMove 20s infinite alternate;
    }
    .blob-1 { top: -10%; right: -10%; background: #fdf2f8; }
    .blob-2 { bottom: -10%; left: -10%; background: #f0f9ff; animation-delay: -5s; }

    @keyframes floatMove {
        from { transform: translate(0, 0); }
        to { transform: translate(50px, 100px); }
    }

    @media (max-width: 768px) {
        .settings-grid { grid-template-columns: 1fr; gap: 20px; }
        .settings-card { padding: 40px 25px; }
    }
</style>
{% endblock %}

{% block content %}
<!-- Background Depth Blobs -->
<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>

<div class="profile-container">
    <div class="settings-card" data-aos="zoom-in">
        <div class="text-center mb-5">
            <h1 class="fw-bold" style="font-size: 3rem; letter-spacing: -2px; color: var(--primary-indigo);">Personalization</h1>
            <p class="fw-bold" style="opacity: 0.7;">Tailor the neural engine to your unique cognitive style.</p>
        </div>

        <form method="POST">
            <!-- VISUAL SECTION -->
            <div class="section-title"><i class="fas fa-eye"></i> Visual Experience</div>
            <div class="settings-grid">
                <div class="setting-item">
                    <label>Color Universe</label>
                    <select name="theme">
                        <option value="light" {% if profile.theme == 'light' %}selected{% endif %}>Standard (Light)</option>
                        <option value="dark" {% if profile.theme == 'dark' %}selected{% endif %}>Deep Space (Dark)</option>
                        <option value="sepia" {% if profile.theme == 'sepia' %}selected{% endif %}>Sepia Journal</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Text Scaling</label>
                    <select name="font_size">
                        <option value="small" {% if profile.font_size == 'small' %}selected{% endif %}>Compact</option>
                        <option value="medium" {% if profile.font_size == 'medium' %}selected{% endif %}>Optimal (Default)</option>
                        <option value="large" {% if profile.font_size == 'large' %}selected{% endif %}>Enhanced (Large)</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Line Breathing Room</label>
                    <select name="line_spacing">
                        <option value="normal" {% if profile.line_spacing == 'normal' %}selected{% endif %}>Normal</option>
                        <option value="relaxed" {% if profile.line_spacing == 'relaxed' %}selected{% endif %}>Relaxed</option>
                        <option value="loose" {% if profile.line_spacing == 'loose' %}selected{% endif %}>Wide Focus</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Active Tracking</label>
                    <select name="highlight_active">
                        <option value="1" {% if profile.highlight_active %}selected{% endif %}>Enabled</option>
                        <option value="0" {% if not profile.highlight_active %}selected{% endif %}>Disabled</option>
                    </select>
                </div>
            </div>

            <!-- AUDIO SECTION -->
            <div class="section-title"><i class="fas fa-wave-square"></i> Auditory Feedback</div>
            <div class="settings-grid">
                <div class="setting-item">
                    <label>Reading Velocity <span class="val-badge" id="speedVal">{{ profile.tts_speed }}x</span></label>
                    <input type="range" name="tts_speed" min="0.5" max="1.5" step="0.1" value="{{ profile.tts_speed }}" oninput="document.getElementById('speedVal').innerText=this.value+'x'">
                </div>
                <div class="setting-item">
                    <label>Voice Resonance <span class="val-badge" id="pitchVal">{{ profile.tts_pitch }}</span></label>
                    <input type="range" name="tts_pitch" min="0.5" max="1.5" step="0.1" value="{{ profile.tts_pitch }}" oninput="document.getElementById('pitchVal').innerText=this.value">
                </div>
            </div>

            <button type="submit" class="save-btn">
                SAVE PREFERENCES <i class="fas fa-save ms-2"></i>
            </button>
        </form>
    </div>
</div>
{% endblock %}
