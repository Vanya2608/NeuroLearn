<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neuro_Learn AI</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/fontawesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
:root {
--bg-color-main: #f9f6f0;
--accent-blue: #4A90E2;
--text-primary: #1C2331;
--card-bg: rgba(255, 255, 255, 0.7);
}

/* --- THEMES --- */
body.dark { --bg-color-main: #121212; --text-primary: #e0e0e0; --card-bg: rgba(30,
30, 30, 0.8); }
body.sepia { --bg-color-main: #f4ecd8; --text-primary: #5b4636; --card-bg: rgba(255,
248, 231, 0.8); }
body.high-contrast { --bg-color-main: #000; --text-primary: #ffff00; --card-bg: #111; }
/* --- TYPOGRAPHY PREFERENCES --- */
body.font-small { font-size: 0.9rem; }
body.font-large { font-size: 1.3rem; }
body.spacing-relaxed { line-height: 2.2; letter-spacing: 0.15em; word-spacing:
0.2em; }
body.spacing-loose { line-height: 2.8; letter-spacing: 0.2em; word-spacing: 0.4em; }
body {
font-family: 'OpenDyslexic', sans-serif;
background-color: var(--bg-color-main);
color: var(--text-primary);
transition: 0.3s background-color;
padding: 20px;
}
.navbar {
display: flex; justify-content: flex-end; gap: 15px; padding: 15px;
background: var(--card-bg); backdrop-filter: blur(10px);
border-radius: 12px; margin-bottom: 30px;
}
.panel {
background: var(--card-bg); backdrop-filter: blur(10px);
border-radius: 20px; padding: 30px; border: 1px solid rgba(255,255,255,0.3);
box-shadow: 0 8px 32px rgba(0,0,0,0.05);
}
/* --- CUSTOM TOOLTIPS --- */
.highlight { position: relative; cursor: help; border-bottom: 2px solid var(--accentblue); }
.highlight::after {
content: attr(data-hint); position: absolute; bottom: 125%; left: 50%;
transform: translateX(-50%) translateY(10px); background: #1C2331; color: white;
padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; white-space: nowrap;
opacity: 0; visibility: hidden; transition: 0.3s ease; z-index: 1000;
}
.highlight:hover::after { opacity: 1; visibility: visible; transform: translateX(-50%)
translateY(0); }
</style>
</head>
<body class="{{ current_user.profile.theme if current_user.is_authenticated else 'light' }}
{{ 'font-' + current_user.profile.font_size if current_user.is_authenticated else 'fontmedium' }} {{ 'spacing-' + current_user.profile.line_spacing if
current_user.is_authenticated else 'spacing-normal' }}">
<div class="navbar">
<a href="/">Home</a>
{% if current_user.is_authenticated %}
<a href="/reader">Reader Tool</a>
<a href="/dashboard">Dashboard</a>
<a href="/profile">Settings</a>
<a href="/logout">Logout</a>
{% else %}
<a href="/login">Login</a>
<a href="/register">Register</a>
{% endif %}
</div>
<div class="container">
{% block content %}{% endblock %}
</div>
</body>
</html>
