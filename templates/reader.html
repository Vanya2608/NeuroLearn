{% extends "base.html" %}

{% block extra_head %}
<style>
    .reader-grid {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        gap: 40px;
        padding: 40px 0;
    }

    .glass-panel {
        background: var(--glass);
        backdrop-filter: blur(40px);
        border-radius: 40px;
        padding: 50px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.04);
        position: relative;
    }

    .label-accent {
        display: inline-block;
        padding: 6px 15px;
        background: var(--primary-indigo);
        color: white;
        border-radius: 10px;
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
        margin-bottom: 20px;
        letter-spacing: 1px;
    }

    textarea {
        background: rgba(255, 255, 255, 0.5);
        border: 2px solid transparent;
        border-radius: 25px;
        padding: 25px;
        font-size: 1.1rem;
        min-height: 350px;
        width: 100%;
        transition: 0.4s;
        margin-bottom: 30px;
        font-weight: 500;
    }
    textarea:focus { background: white; border-color: var(--primary-indigo); outline: none; box-shadow: 0 15px 40px rgba(67, 56, 202, 0.08); }

    .option-pill-box {
        display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px;
    }
    .check-pill {
        background: rgba(255, 255, 255, 0.4);
        padding: 12px 20px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.3s;
        border: 1px solid rgba(0,0,0,0.03);
    }
    .check-pill:hover { background: white; transform: scale(1.02); }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary-indigo); }

    .output-canvas {
        background: white;
        border-radius: 30px;
        padding: 40px;
        min-height: 500px;
        font-size: 1.4rem;
        line-height: 2;
        box-shadow: inset 0 5px 20px rgba(0,0,0,0.02);
        color: #1e1b4b;
    }
    body.dark .output-canvas { background: #1e293b; color: #f8fafc; }

    @media (max-width: 1100px) { .reader-grid { grid-template-columns: 1fr; } }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="reader-grid">
        <!-- LEFT: INPUT -->
        <div class="glass-panel" data-aos="fade-right">
            <span class="label-accent">Neural Input</span>
            <h2 class="fw-bold mb-4" style="letter-spacing: -1px;">Transform Your Reading.</h2>
            
            <textarea id="sourceText" placeholder="Drop your text here..."></textarea>

            <div class="option-pill-box">
                <label class="check-pill"><input type="checkbox" id="opt-normalize" checked> Formatter</label>
                <label class="check-pill"><input type="checkbox" id="opt-simplify"> AI Simplified</label>
                <label class="check-pill"><input type="checkbox" id="opt-syllables"> Syllables</label>
                <label class="check-pill"><input type="checkbox" id="hl-homophones" checked> Homophones</label>
                <label class="check-pill"><input type="checkbox" id="hl-visually" checked> Visuals</label>
                <label class="check-pill"><input type="checkbox" id="hl-misread" checked> Pairs</label>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 4fr; gap: 15px;">
                <button class="btn-glow" style="background: #fb7185;" onclick="clearText()"><i class="fas fa-trash-alt"></i></button>
                <button class="btn-glow" id="convertBtn" onclick="convertText()">INITIALIZE ENGINE <i class="fas fa-bolt ms-2"></i></button>
            </div>
        </div>

        <!-- RIGHT: OUTPUT -->
        <div class="glass-panel" data-aos="fade-left">
            <span class="label-accent" style="background: #10b981;">Optimized View</span>
            <h2 class="fw-bold mb-4" style="letter-spacing: -1px;">Read Effortlessly.</h2>
            
            <div id="outputArea" class="output-canvas"></div>

            <button class="btn-glow w-100 mt-4" id="listenBtn" onclick="readAloud()" disabled style="background: #6366f1; border-radius: 20px; padding: 20px;">
                <i class="fas fa-play-circle me-2"></i> ACTIVATE AUDIO SYNC
            </button>
        </div>
    </div>
</div>

<script>
    let startTime;
    async function convertText() {
        const rawText = document.getElementById('sourceText').value;
        if (!rawText.trim()) return;
        const btn = document.getElementById('convertBtn');
        const outputArea = document.getElementById('outputArea');
        btn.innerHTML = '<i class="fas fa-sync fa-spin"></i> Processing...';
        
        const highlights = [];
        if(document.getElementById('hl-homophones').checked) highlights.push('homophones');
        if(document.getElementById('hl-visually').checked) highlights.push('visually_similar');
        if(document.getElementById('hl-misread').checked) highlights.push('misread');

        const payload = {
            text: rawText,
            simplify: document.getElementById('opt-simplify').checked,
            syllables: document.getElementById('opt-syllables').checked,
            normalize: document.getElementById('opt-normalize').checked,
            highlights: highlights
        };

        try {
            const response = await fetch('/process', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            outputArea.innerHTML = data.processed_html;
            document.getElementById('listenBtn').disabled = false;
            startTime = new Date();
        } catch (err) { alert('Engine Error'); }
        finally { btn.innerHTML = 'INITIALIZE ENGINE <i class="fas fa-bolt ms-2"></i>'; }
    }

    function clearText() {
        document.getElementById('sourceText').value = '';
        document.getElementById('outputArea').innerHTML = '';
        document.getElementById('listenBtn').disabled = true;
        window.speechSynthesis.cancel();
    }

    async function readAloud() {
        window.speechSynthesis.cancel();
        const response = await fetch('/api/user_preferences');
        const prefs = await response.json();
        const utterance = new SpeechSynthesisUtterance(document.getElementById('outputArea').innerText);
        utterance.rate = prefs.tts_speed || 0.85;
        utterance.pitch = prefs.tts_pitch || 1.0;
        window.speechSynthesis.speak(utterance);
    }
</script>
{% endblock %}
