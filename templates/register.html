{% extends "base.html" %}

{% block extra_head %}
<style>
    .auth-container {
        min-height: 90vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 20px;
    }
    .auth-card {
        background: var(--glass);
        backdrop-filter: blur(35px);
        padding: 70px; /* High padding for cleanliness */
        border-radius: 50px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 50px 120px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 600px; /* Larger max width */
        position: relative;
    }
    .auth-card h2 {
        font-size: 3.2rem;
        font-weight: 800;
        margin-bottom: 10px;
        color: var(--primary-indigo);
        letter-spacing: -2px;
    }
    .subtitle { font-size: 1.1rem; opacity: 0.6; margin-bottom: 50px; display: block; font-weight: 600; }

    .form-group { margin-bottom: 30px; }
    .form-label { font-size: 0.8rem; font-weight: 800; text-uppercase: uppercase; letter-spacing: 1.5px; color: var(--primary-indigo); margin-bottom: 12px; display: block; }

    .form-control {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(0, 0, 0, 0.05);
        border-radius: 22px;
        padding: 18px 28px;
        font-size: 1.1rem;
        font-weight: 600;
        width: 100%;
        transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .form-control:focus {
        background: white;
        border-color: var(--primary-indigo);
        box-shadow: 0 15px 40px rgba(67, 56, 202, 0.12);
        outline: none;
        transform: scale(1.02);
    }
    .btn-glow { border-radius: 22px; font-size: 1.2rem; letter-spacing: 1px; font-weight: 800; padding: 20px; }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" data-aos="fade-up">
        <div class="text-center">
            <h2>Join Us.</h2>
            <span class="subtitle">Start your personalized learning experience today.</span>
        </div>

        <form method="POST">
            <div class="form-group">
                <label class="form-label">Choose Username</label>
                <input type="text" name="username" class="form-control" placeholder="Unique identifier" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Create Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-glow w-100 mt-3">
                CREATE MY ACCOUNT <i class="fas fa-sparkles ms-2"></i>
            </button>
        </form>

        <div class="text-center mt-5">
            <p class="small fw-bold opacity-60">Already have an account? <a href="{{ url_for('login') }}" class="text-primary text-decoration-none">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
